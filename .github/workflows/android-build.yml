name: Build WebView Android APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Clean Project Structure
      run: |
        rm -f package.json package-lock.json
        rm -rf node_modules android dist
        mkdir -p dist
        
        # كتابة ملف هندسي ثابت لمنع مشاكل تعارض الإصدارات تلقائياً
        cat << 'EOF' > package.json
        {
          "name": "odysseus-webview",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "@capacitor/android": "^6.0.0",
            "@capacitor/core": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0"
          }
        }
        EOF

    - name: Create Automated Web Container
      run: |
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Odysseus AI</title><script>window.location.href = "https://google.com";</script></head><body><h2 style="text-align:center;margin-top:100px;font-family:sans-serif;color:#333;">Connecting to Odysseus Server...</h2></body></html>' > dist/index.html

    - name: Install Hardened Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Initialize Capacitor Framework
      run: |
        npx cap init Odysseus com.moayad.odysseus --web-dir=dist

    - name: Inject Android Platform
      run: |
        npx cap add android

    - name: Sync Production Assets
      run: |
        npx cap sync android

    - name: Compile and Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odysseus-WebView-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
