name: Build Android APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Web Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Initialize Capacitor Android Platform
      run: |
        npx cap init Odysseus com.moayad.odysseus --web-dir=dist
        npx cap add android

    - name: Sync Web Assets to Android App
      run: npx cap sync android

    - name: Compile and Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odysseus-Android-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
