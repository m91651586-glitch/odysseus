name: Build WebView Android APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Clean and Initialize Build Environment
      run: |
        rm -f package.json package-lock.json
        rm -rf node_modules android dist
        npm init -y

    - name: Create Automated Web Container
      run: |
        mkdir -p dist
        echo '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Odysseus AI</title><script>window.location.href = "https://google.com";</script></head><body><h2 style="text-align:center;margin-top:100px;font-family:sans-serif;color:#333;">Connecting to Odysseus Server...</h2></body></html>' > dist/index.html

    - name: Install Capacitor Dependencies
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps

    - name: Initialize Capacitor Project
      run: |
        npx cap init Odysseus com.moayad.odysseus --web-dir=dist

    - name: Add Android Platform
      run: |
        npx cap add android

    - name: Sync Web Assets to Android
      run: |
        npx cap sync android

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odysseus-WebView-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
