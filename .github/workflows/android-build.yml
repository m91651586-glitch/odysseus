name: Build Hardened Local Offline APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code (Odysseus Engine)
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Construct Hardened Offline Structure
      run: |
        rm -f package.json package-lock.json
        rm -rf node_modules android dist
        mkdir -p dist
        
        # 1. نسخ كافة ملفات الأداة البرمجية والواجهات المحلية لتصبح داخل الحزمة الثابتة
        cp -r * dist/ 2>/dev/null || true
        
        # 2. بناء ملف التعريف لإدارة الحزمة وتجنب تعارض الإصدارات
        cat << 'EOF' > package.json
        {
          "name": "odysseus-local-core",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "@capacitor/android": "^6.0.0",
            "@capacitor/core": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0"
          }
        }
        EOF

    - name: Install System Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Initialize Local Android Shell (No Web Routing)
      run: |
        npx cap init Odysseus com.moayad.odysseus --web-dir=dist

    - name: Inject Production Android Platform
      run: |
        npx cap add android

    - name: Synchronize Local Assets and Core Scripts
      run: |
        npx cap sync android

    - name: Compile and Build Fully Offline APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Export Hardened Production Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Odysseus-Pure-Offline-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
