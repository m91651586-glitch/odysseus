<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة Odysseus الذكية</title>
    <style>
        :root { --bg-color: #0b0f19; --container-bg: #111827; --primary-blue: #3b82f6; --accent-green: #10b981; --text-main: #f3f4f6; --text-muted: #9ca3af; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--container-bg); padding: 15px; text-align: center; border-bottom: 1px solid #1f2937; }
        header h1 { color: var(--primary-blue); font-size: 1.4rem; margin: 0; }
        header p { color: var(--accent-green); font-size: 0.85rem; margin: 5px 0 0 0; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
        .user { background-color: var(--primary-blue); align-self: flex-start; border-bottom-right-radius: 2px; }
        .ai { background-color: var(--container-bg); align-self: flex-end; border-bottom-left-radius: 2px; border: 1px solid #1f2937; }
        .input-container { background-color: var(--container-bg); padding: 12px; display: flex; gap: 10px; border-top: 1px solid #1f2937; }
        input { flex: 1; background-color: var(--bg-color); border: 1px solid #374151; border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        button { background-color: var(--accent-green); color: #000; font-weight: bold; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; }
        button:disabled { background-color: var(--text-muted); }
        #status-indicator { font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 5px; background-color: #1f2937; }
    </style>
</head>
<body>
    <header>
        <h1>منصة Odysseus الذكية</h1>
        <p>النظام مستقر وعامل محلياً 100% (Offline)</p>
    </header>
    <div id="status-indicator">جاري تهيئة بيئة المعالجة الرسومية المحلية WebGPU...</div>
    <div id="chat-box">
        <div class="message ai">مرحباً بك يا مؤيد. أنا Odysseus، عقل الذكاء الاصطناعي المحلي الخاص بك. كيف يمكنني مساعدتك اليوم؟</div>
    </div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." disabled>
        <button id="send-btn" disabled>إرسال</button>
    </div>

    <script type="module">
        import { CreateWebWorkerEngine } from "https://esm.run/@mlc-ai/web-llm";

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusIndicator = document.getElementById('status-indicator');

        // استخدام نموذج Llama-3 خفيف جداً ومناسب للهواتف
        const selectedModel = "Llama-3-8B-Instruct-q4f32_1-MLC"; 

        let engine;

        async function initAI() {
            try {
                engine = await CreateWebWorkerEngine(
                    new Worker(new URL("https://esm.run/@mlc-ai/web-llm", import.meta.url)),
                    selectedModel,
                    {
                        initProgressCallback: (report) => {
                            statusIndicator.innerText = `جاري تحميل الأوزان الذكية لذاكرة الهاتف: ${Math.round(report.progress * 100)}%`;
                        }
                    }
                );
                statusIndicator.innerText = "تم تفعيل العقل المحلي بنجاح! الأداة جاهزة تماماً دون اتصال.";
                statusIndicator.style.color = "#10b981";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusIndicator.innerText = "خطأ: تأكد من أن هاتفك يدعم WebGPU.";
                statusIndicator.style.color = "#ef4444";
                console.error(error);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';
            const aiMessageDiv = appendMessage('جاري التفكير...', 'ai');

            try {
                const messages = [{ role: "user", content: text }];
                const reply = await engine.chat.completions.create({ messages });
                aiMessageDiv.innerText = reply.choices[0].message.content;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                aiMessageDiv.innerText = "حدث خطأ أثناء المعالجة.";
            }
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        window.onload = initAI;
    </script>
</body>
</html>
